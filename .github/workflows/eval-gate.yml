name: eval-gate
# Шаблон для студентського репозиторію (корінь = вміст starter/).
# Піднімає стек, ганяє evals проти сервісу, блокує regression на pull request.
on:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Up stack (без UI — для evals не потрібен)
        run: docker compose up -d --build service

      - name: Wait for service
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/health; then exit 0; fi
            sleep 5
          done
          echo "service did not become healthy"
          docker compose logs
          exit 1

      - name: Wait for gateway (холодний LiteLLM дає 500 на перший запит)
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4000/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{"model":"mock","messages":[{"role":"user","content":"hi"}]}' || true)
            # будь-який 2xx — шлюз готовий; на відмову з'єднання curl дає 000
            case "$code" in
              2??) exit 0 ;;
            esac
            sleep 5
          done
          echo "gateway not ready (last code: $code)"
          docker compose logs gateway
          exit 1

      # /health не торкається Postgres: поки initdb ще виконує db/schema.sql, перші кейси
      # отримали б 503 замість відповіді. Чекаємо, доки реєстр промптів читається і має
      # активну версію. Це очікування готовності стеку, не повтор evals: самі evals
      # запускаються рівно один раз.
      - name: Wait for prompt registry
        run: |
          body="${RUNNER_TEMP:-/tmp}/prompts.json"
          for i in $(seq 1 40); do
            code=$(curl -s -o "$body" -w "%{http_code}" http://localhost:8080/prompts || true)
            case "$code" in
              200) if grep -q '"active":true' "$body"; then exit 0; fi ;;
            esac
            sleep 5
          done
          echo "prompt registry not ready (last code: $code)"
          cat "$body" || true
          docker compose logs service postgres
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # поріг 31/32 (N − 1) — свідомий запас на один флейк, строгіше за правило
      # ceil(0.85·32) = 28. Кожен тип кейсів (префікс id) має щонайменше 3 варіації одного
      # механізму, тож поломка механізму валить ≥ 3 кейси і гейт червоніє. Регресію, що
      # зачіпає лише один кейс, поріг N − 1 пропускає — дивись рядки по кейсах.
      # Додаєш кейс — піднімай поріг до N − 1 у тій самій зміні.
      - name: Evals
        env:
          SERVICE_URL: http://localhost:8080
        run: python evals/run.py --dataset evals/golden.jsonl --threshold 31

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Down
        if: always()
        run: docker compose down -v
