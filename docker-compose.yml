services:
  ui:
    build: ./ui
    ports: ["4200:4200"]
    depends_on: [service]

  service:
    build: ./service
    ports: ["8080:8080"]
    environment:
      - GATEWAY_URL=http://gateway:4000
      - DB_CONN=Host=postgres;Database=llmops;Username=llmops;Password=llmops
      - MODEL=${MODEL:-mock}   # mock (за замовч.) або gpt-5-mini / claude-haiku (потрібен ключ у gateway/.env)
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}   # Swagger для мейнтейнерів: true або 1 вмикає (за замовч. вимкнено)
      - BUDGET_USD=${BUDGET_USD:-5}   # денний бюджет у USD: GET /cost і budget-політика (з 80% — деградація на mock-mini)
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-600}   # скільки секунд живе закешована відповідь (W3)
      - TOOL_TIMEOUT_MS=${TOOL_TIMEOUT_MS:-2000}   # бюджет часу на один виклик інструмента, мс (W3)
      - APPROVAL_TTL_SECONDS=${APPROVAL_TTL_SECONDS:-900}   # скільки секунд заявка HITL чекає на approve, потім expired (W4)
    depends_on: [gateway, postgres]

  gateway:
    # nightly-тег рухомий — пінимо перевірений digest, щоб у всіх студентів був той самий gateway
    image: ghcr.io/berriai/litellm:main-latest@sha256:80ea654c506da9083503d00c1b323b2fecddf17af6add9bf01b2603938e17bd2
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    volumes:
      - ./gateway/litellm-config.yaml:/app/config.yaml:ro
    # ключі провайдерів — лише тут, і лише з файлу (для mock він не потрібен,
    # тому required: false). НЕ дублюй їх у environment: той має вищий
    # пріоритет і перебив би env_file порожнім значенням.
    env_file:
      - path: gateway/.env
        required: false
    depends_on: [mock-provider]

  mock-provider:
    build: ./mock-provider
    expose: ["9000"]

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=llmops
      - POSTGRES_PASSWORD=llmops
      - POSTGRES_DB=llmops
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data

  # --- optional (advanced): docker compose --profile advanced up ---
  redis:
    image: redis:7
    profiles: ["advanced"]
    ports: ["6379:6379"]

  # метрики (HW6, опційно): Prometheus опитує GET /metrics сервісу, Grafana показує дашборд.
  # історія Prometheus — в анонімному томі образу: up її успадковує, після down новий контейнер стартує порожнім; у Grafana тому немає
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["advanced"]
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [service]

  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["advanced"]
    ports: ["3000:3000"]
    # анонімний перегляд — щоб ніхто не логінився; лише для локального запуску.
    # перевірки оновлень і попереднє встановлення плагінів вимкнені: стек не ходить у мережу по них
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata:
